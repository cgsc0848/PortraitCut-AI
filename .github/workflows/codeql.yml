name: CodeQL

on:
  push:
    branches: [main, audit-ui-v0.2]
  pull_request:
    branches: [main]
  schedule:
    - cron: "23 5 * * 2"

jobs:
  analyze:
    name: Analyze Python
    runs-on: windows-latest
    permissions:
      actions: read
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@v4
      - uses: github/codeql-action/init@v3
        with:
          languages: python
      - uses: github/codeql-action/analyze@v3
